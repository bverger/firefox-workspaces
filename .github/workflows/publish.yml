# Submits a version to addons.mozilla.org when a vX.Y.Z tag is pushed
# (tools/release.sh does that). Needs the WEB_EXT_API_KEY and
# WEB_EXT_API_SECRET repository secrets (AMO → Tools → Manage API Keys).
name: Publish to AMO

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10.8.0 lint

      # Listed versions go through Mozilla's review; this returns once submitted.
      - name: Submit to AMO
        run: npx --yes web-ext@10.8.0 sign --channel=listed --artifacts-dir dist
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
